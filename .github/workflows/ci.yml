name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: e2e (presets and frameworks)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
      AGENT_UNIT_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

  examples:
    name: examples (universal build, Farm app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Universal build on every host
        working-directory: examples/universal
        run: npm ci && npm run try
      - name: AI SDK on Cloudflare, Durable Objects build
        working-directory: examples/cloudflare-ai-sdk
        run: |
          rm -rf .output
          npm ci && npm run build
          node -e 'const w=require("./.output/server/wrangler.json"); if (w.durable_objects.bindings.length !== 2 || w.compatibility_date < "2025-09-01") process.exit(1)'
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
      - name: Farm app, production build and restart
        working-directory: examples/farm-app
        run: npm ci && npm run smoke
