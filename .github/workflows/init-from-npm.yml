name: init apps from npm

# Apps written by `agent-unit init`, installed from npm at the ranges the templates pin: every day, so
# a new SDK release that breaks them shows up without a pull request, and on changes to the templates.
on:
  pull_request:
    paths:
      - "src/build/init*.ts"
      - "scripts/check-init.mjs"
      - ".github/workflows/init-from-npm.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: init-from-npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: init apps install, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The apps that choose Bun or Deno are started on them too.
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:init
